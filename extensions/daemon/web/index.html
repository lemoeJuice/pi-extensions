<body>
<header class="topbar"><a id="brand" class="brand" href="/"><span class="brand-mark">π</span><span>Pi Remote</span></a><span id="top-context" class="top-context"></span></header>
<main id="app"><div class="loading">Loading…</div></main><div id="toast-root"></div>
<script>
const app=document.querySelector('#app'),toastRoot=document.querySelector('#toast-root'),path=location.pathname,sid=path.startsWith('/s/')?decodeURIComponent(path.slice(3)):null;
let sessionMetadata=null,activeCommand=null,pendingApprovals=[],ws,seenSeq=new Map(),liveAssistant=null,liveAssistantText='',liveThinkingText='',liveThinkingDetails=null,toolCards=new Map(),lastStatus='',availableCommands=[],seenMessages=new Set(),pendingUserMessages=[],earlyUserMessages=new Map(),earlyUnmatchedUsers=[],acknowledgedRequestIds=new Set(),historyBefore=null,historyHasMore=false,historyLoading=false,historyReady=!sid,pendingFrames=[],wasConnected=false,historyWatermark=0,sessionRetryInFlight=false,sessionRecoveryInFlight=false,suppressAutoScroll=false,followConversation=true;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message){const e=document.createElement('div');e.className='toast';e.textContent=message;toastRoot.replaceChildren(e);setTimeout(()=>{if(e.parentNode)e.remove()},2600)}
function renderApproval(){const dialog=document.querySelector('#approval-dialog'),approval=pendingApprovals[0];if(!dialog)return;dialog.hidden=!approval;if(!approval)return;document.querySelector('#approval-tool').textContent=approval.toolName||'Tool';document.querySelector('#approval-intent').textContent=approval.intent||'No intent supplied';document.querySelector('#approval-reason').textContent=approval.reason||'Permission review required';document.querySelector('#approval-behavior').textContent=approval.behavior||'';dialog.querySelectorAll('[data-approval-choice]').forEach(button=>button.disabled=false);const error=document.querySelector('#approval-error');error.hidden=true;error.textContent=''}
function queueApproval(approval){if(!approval?.requestId||pendingApprovals.some(item=>item.requestId===approval.requestId))return;pendingApprovals.push(approval);renderApproval()}
function resolveApproval(requestId){pendingApprovals=pendingApprovals.filter(item=>item.requestId!==requestId);renderApproval()}
async function answerApproval(choice){const approval=pendingApprovals[0];if(!approval)return;const buttons=document.querySelectorAll('[data-approval-choice]');buttons.forEach(button=>button.disabled=true);try{const response=await fetch(`/api/sessions/${encodeURIComponent(sid)}/approvals`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:approval.requestId,choice})});if(!response.ok){const body=await response.json().catch(()=>({}));const error=document.querySelector('#approval-error');error.textContent=body.error||'Could not send permission choice';error.hidden=false;buttons.forEach(button=>button.disabled=false);return}pendingApprovals=pendingApprovals.filter(item=>item.requestId!==approval.requestId);renderApproval()}catch{const error=document.querySelector('#approval-error');error.textContent='Connection error. The operation remains blocked until a choice is delivered.';error.hidden=false;buttons.forEach(button=>button.disabled=false)}}
function markdown(source){const safe=esc(source);return safe.split(/```([^\n`]*)\n([\s\S]*?)```/g).map((part,i)=>i%3===2?`<pre><code>${part}</code></pre>`:i%3===1?'':part.replace(/`([^`]+)`/g,'<code>$1</code>').split(/\n\n+/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')).join('')}
function textOf(content){if(typeof content==='string')return content;if(!Array.isArray(content))return '';return content.map(c=>c?.type==='text'?c.text:c?.type==='image'?'[image]':'').filter(Boolean).join('\n')}
function formatTokens(value){const n=Number(value)||0;return n<1000?String(n):`${(n/1000).toFixed(n>=10000?0:1)}k`}
function renderMetadata(metadata){sessionMetadata=metadata||sessionMetadata;const usage=document.querySelector('#usage-summary'),thinking=document.querySelector('#thinking-note'),model=document.querySelector('.model-note'),fast=document.querySelector('#fast-note');if(!usage)return;const m=sessionMetadata||{},ctx=m.contextUsage||{},totals=m.totals||{};const context=ctx.percent==null?'—':`${Math.round(ctx.percent)}%`,allInput=(Number(totals.input)||0)+(Number(totals.cacheRead)||0),hit=allInput?(Number(totals.cacheRead)||0)/allInput*100:0;usage.textContent=`${context} of ${formatTokens(ctx.contextWindow)} / In ${formatTokens(totals.input)} / Out ${formatTokens(totals.output)} / Cache ${formatTokens(totals.cacheRead)} / HitRate ${hit.toFixed(1)}%`;if(thinking)thinking.textContent=m.thinkingLevel||'';if(model&&m.model)model.textContent=m.model;if(fast){fast.hidden=m.fastMode!==true;fast.textContent=m.fastMode===true?'Fast':''}}
function updateFollowConversation(){if(suppressAutoScroll)return;followConversation=document.documentElement.scrollHeight-window.scrollY-window.innerHeight<140}
window.addEventListener('scroll',updateFollowConversation,{passive:true});
function scrollBottom(){if(suppressAutoScroll||!followConversation)return;const box=document.querySelector('#conversation');if(box)box.scrollTop=box.scrollHeight;window.scrollTo(0,document.documentElement.scrollHeight)}
function makeMessage(role,text,live=false,entryId,timestamp){const box=document.querySelector('#conversation');if(!box)return null;const node=document.createElement('article');node.className=`message ${role}`;if(entryId){node.dataset.entryId=entryId;seenMessages.add(entryId)}const date=timestamp?new Date(timestamp):new Date();node.innerHTML=`<div class="message-label">${role==='user'?'You':'Pi'} <span class="message-time">${date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div><div class="message-body"></div>`;node.querySelector('.message-body').innerHTML=markdown(text);box.append(node);if(live)liveAssistant=node;return node}
function setAssistantText(text){liveAssistantText=String(text||'');if(!liveAssistantText.trim())return;if(!liveAssistant&&liveThinkingDetails){liveThinkingText='';liveThinkingDetails=null}if(!liveAssistant)liveAssistant=makeMessage('assistant','',true);if(!liveAssistant)return;const body=liveAssistant.querySelector('.message-body');body.innerHTML=markdown(liveAssistantText);scrollBottom()}
function normalizeThinking(text){return String(text||'').replace(/\r\n?/g,'\n').replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]*\n+/g,'\n').replace(/^\n+|\n+$/g,'')}
function setupThinkingToggle(details){details.addEventListener('toggle',()=>{const label=details.querySelector('.thinking-label');if(label)label.textContent=details.open?'收起思考过程':'展开思考过程'})}

function connect(){ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}${sid?'/ws/sessions/'+encodeURIComponent(sid):'/ws/sessions'}`);ws.onopen=()=>{if(sid&&wasConnected)void recoverSession();wasConnected=true};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='event'&&sid)displayEvent(m);else if(m.type==='approval_request'&&sid)queueApproval(m);else if(m.type==='approval_resolved'&&sid)resolveApproval(m.requestId);else if(m.type==='session_available'&&sid)void retryMissingSession()}catch{}};ws.onclose=()=>{if(sid)historyReady=false;setTimeout(connect,2000)};ws.onerror=()=>ws.close()}
